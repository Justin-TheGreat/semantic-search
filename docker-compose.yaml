services:

  api:
    build:
      context: .
      target: runtime
    container_name: search-api
    secrets:
      - db_password
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - ENABLE_HYBRID=true
      - VLLM_BASE_URL=http://vllm:8000/v1
      - HF_HOME=/models/hf
    volumes:
      - model-cache:/models
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [ frontend, backend ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  db:
    image: postgres:15-alpine
    container_name: search-db
    secrets:
      - db_password
    environment:
      POSTGRES_USER: searchuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: searchdb
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U searchuser -d searchdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ backend ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: search-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
    networks: [ backend ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  qdrant:
    # v1.12+ required for the hybrid Query API (prefetch + RRF fusion)
    image: qdrant/qdrant:v1.12.4
    container_name: search-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [ backend ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: search-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/ssl/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [ frontend ]
    restart: unless-stopped

  # --- GPU serving tier (Phase 2): docker compose --profile gpu up -d ---
  vllm:
    # Pinned (not :latest): 0.7.3 predates vLLM's newer V2 GPU model runner,
    # which requires CUDA UVA and crashes ("RuntimeError: UVA is not
    # available") under Docker Desktop's WSL2 GPU passthrough. Verified
    # working on RTX 3060 / WSL2 / Docker Desktop.
    image: vllm/vllm-openai:v0.7.3
    container_name: search-vllm
    profiles: [ gpu ]
    command: >-
      --model Qwen/Qwen2.5-0.5B-Instruct
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ipc: host
    ports:
      - "8001:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    networks: [ backend ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # --- Monitoring (Phase 6): docker compose --profile monitoring up -d ---
  prometheus:
    image: prom/prometheus:latest
    container_name: search-prometheus
    profiles: [ monitoring ]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [ backend ]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: search-grafana
    profiles: [ monitoring ]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [ backend ]
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pg-data:
  redis-data:
  qdrant-data:
  model-cache:
  vllm-cache:
  prometheus-data:
  grafana-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
