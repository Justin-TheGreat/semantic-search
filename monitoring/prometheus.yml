global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: semantic-search
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  # vLLM exports its own Prometheus metrics (tokens/s, KV-cache usage, queue depth).
  # Only resolvable when the gpu profile is up; shows as DOWN otherwise, which is fine.
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: /metrics
