services:
  api:
    build:
      target: runtime
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src             # live code mount
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"               # expose api directly for debugging

  db:
    ports:
      - "5432:5432"               # connect with pgAdmin/DBeaver from host

  qdrant:
    ports:
      - "6333:6333"               # qdrant UI at http://localhost:6333/dashboard