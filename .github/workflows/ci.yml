name: ci

on:
  push:
    branches: [main, capstone/ragship]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU torch first: avoids pulling the multi-GB CUDA wheel on runners
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src eval tests
      - name: Unit tests
        run: pytest tests/ -v

  # THE eval quality gate: blocks merges that regress RAG retrieval quality.
  # Runs retrieval-only (no GPU/LLM needed) against real Qdrant/Postgres/Redis.
  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: searchuser
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: searchdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U searchuser -d searchdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      QDRANT_HOST: localhost
      DB_HOST: localhost
      REDIS_HOST: localhost
      MODEL_CACHE_DIR: /tmp/models
      HF_HOME: /tmp/models/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Ingest golden corpus
        run: python -m src.ingest data/articles.jsonl
      - name: Eval quality gate (score >= 0.8 or the build goes red)
        run: python -m eval.run_eval --threshold 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/report.json

  build-scan-push:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ragship:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ragship:ci
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase owner
        if: github.event_name == 'push'
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/ragship:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/ragship:latest
          cache-from: type=gha

  # Runners can't reach the local kind cluster, so CI validates the deploy
  # artifacts; the actual deploy stays local via `terraform apply`.
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/ragship
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests
        run: helm template deploy/helm/ragship | kubeconform -strict -summary
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
